image:
  repository: ghcr.io/mfeldheim/kube-nat
  tag: latest
  pullPolicy: IfNotPresent

namespace: kube-nat

agent:
  irsaRoleArn: ""          # set to your IRSA IAM role ARN
  mode: auto               # "auto" or "manual"
  conntrackMax: ""         # override nf_conntrack_max (empty = kernel default)
  tagPrefix: kube-nat
  discovery: ""            # when set, filters route tables by kube-nat/discovery=<value> (multi-VPC safe)
  leaseDuration: ""        # KUBE_NAT_LEASE_DURATION, e.g. "30s" (empty = agent default)
  reconcileInterval: ""    # KUBE_NAT_RECONCILE_INTERVAL, e.g. "30s" (empty = agent default)
  standDownOnDrain: true   # KUBE_NAT_STAND_DOWN_ON_DRAIN: a draining node's agent releases its AZ lease and stops claiming routes
  drainPollInterval: ""    # KUBE_NAT_DRAIN_POLL_INTERVAL, e.g. "5s" (empty = agent default)
  nodeSelector: {}  # override in your values file; no default to avoid merge conflicts
  # Tolerations for the NAT node taint. The DaemonSet controller always adds the
  # standard node-condition tolerations (not-ready, unreachable, *-pressure,
  # unschedulable, network-unavailable) on top of these.
  tolerations:
    - key: node-role.kubernetes.io/nat
      operator: Exists
      effect: NoSchedule
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

dashboard:
  replicas: 1
  scrapeInterval: 5s
  port: 8080
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

serviceMonitor:
  enabled: false           # set true if Prometheus Operator is installed
  interval: 30s
